[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bioinfo-toolkit"
version = "0.1.0"
description = "A comprehensive collection of Python scripts for bioinformatics analysis"
readme = "README.md"
authors = [
    {name = "Pierre Pericard", email = "your.email@example.com"}
]
license = {file = "LICENSE"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.6"
dependencies = [
    "psutil>=5.9.0",
    "pandas>=1.3.0",
    "matplotlib>=3.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.10.0",
    "flake8>=6.0.0",
    "black>=23.0.0",
    "memory_profiler>=0.61.0",
]

[project.scripts]
bioinfo-toolkit = "bioinfotoolkit.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["bioinfotoolkit"] 